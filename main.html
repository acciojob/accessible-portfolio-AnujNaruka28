<!DOCTYPE html>

<html>

<head>
	<title> ARIA Role Implementation </title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
	</script>

	<h1 role="heading">
		My Portfolio
	</h1>

	<nav role="navigation"> 
		<a href="#about">About</a>
		<a href="#projects">Projects</a>
		<a href="#contact">Contact</a>
	</nav>
	
	<img src="profile.jpg" alt="image of portfolio owner" role="img"/>

	<p>
		Hello, I am a full stack developer
	</p>

	<ul role="list">
		<li role="listitem">
			Web Development
		</li>
		<li role="listitem">
			Frontend Development
		</li>
		<li role="listitem">
			Backend Development
		</li>
	</ul>

</body>

</html>
